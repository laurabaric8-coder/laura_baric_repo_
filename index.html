<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Moji Web Zadaci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #af6d89; 
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background-color: #d63384 !important; 
        }

        .hero-box {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #d63384;
        }

        .btn-pink {
            background-color: #d63384;
            color: white;
            border-radius: 50px; 
            padding: 12px 30px;
            border: none;
            transition: 0.3s;
        }

        .btn-pink:hover {
            background-color: #c2186a;
            color: white;
            transform: scale(1.05); 
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Moji Web Zadaci</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="osobna/index.html">Osobna</a>
            <a class="nav-link" href="kontakt/index.html">Kontakt</a>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="hero-box">
                <h1 class="display-4 fw-bold mb-4">Dobrodošli!</h1>
                <p class="lead text-muted mb-5">Ovo je moja početna stranica na kojoj objavljujem svoje web zadatke.</p>
                <a href="osobna/index.html" class="btn btn-pink btn-lg">Saznaj više o meni</a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
